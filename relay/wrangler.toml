name = "ag-remote-relay"
main = "src/worker.ts"
compatibility_date = "2026-10-01"

# Served only on the custom domain. Deploying creates the DNS record and certificate.
workers_dev = false
routes = [{ pattern = "remote.taqnik.in", custom_domain = true }]

# The phone app (same files the local Wi-Fi server serves). Every request goes through the Worker
# so it can add security headers and serve the app at /p/<room>.
[assets]
directory = "../src/pwa"
binding = "ASSETS"
run_worker_first = true

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[durable_objects.bindings]]
name = "CODES"
class_name = "CodeStore"

[[durable_objects.bindings]]
name = "LIMITER"
class_name = "ConnLimiter"

[vars]
# Per IP per minute. Raise WS_CONNECTS_PER_MINUTE if users behind one carrier IP hit 429s.
WS_CONNECTS_PER_MINUTE = "60"
# Pairing-code lookups/registrations: every lookup is a guess at someone's code, so keep this low.
CODE_REQUESTS_PER_MINUTE = "10"

# SQLite-backed class: required for Durable Objects on the free plan.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["CodeStore"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["ConnLimiter"]
